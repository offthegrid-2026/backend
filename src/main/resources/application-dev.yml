#development version of configuration

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/otg
    username: postgres
    password: agartala
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  app:
    jwt:
      secret: ${JWT_SECRET_KEY}
      expiration-ms: 604800000
    otp:
      expiry-minutes: 5
      max-requests-per-window: 3
      request-window-minutes: 10
      max-verify-attempts: 5
    razorpay:
      key-id: ${RAZORPAY_KEY_ID}
      key-secret: ${RAZORPAY_KEY_SECRET}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    payment:
      currency: INR
      reservation-hold-minutes: 10

logging:
  level:
    root: INFO
    com.event.otg_backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  file:
    name: logs/otg-backend.log

management:
  endpoints:
    web:
      exposure:
        include: health,logfile